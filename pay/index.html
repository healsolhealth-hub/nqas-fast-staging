<!-- 18 Nov 2026: app.thehealsol.com/pay/ (and /pay/?l=PAY-XXXXXX) opens the app's payment page (shared/paypage.js) -->
<script>
(function () {
  var m = /[?&]l=(PAY-[A-Za-z2-9]{6})\b/.exec(location.search || '');
  location.replace('../?' + (m ? 'l=' + m[1].toUpperCase() : 'pay=1'));
})();
</script>
